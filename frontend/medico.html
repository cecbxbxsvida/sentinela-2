<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">

  <title>Painel Médico</title>

  <style>

    .btn-tv {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn-abrir-tv:hover {
      background: #117a8b;
    }

    .btn-abrir-tv {
      background: #17a2b8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    .consultorio-input {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      background: #f0f4ff;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #d0d8f0;
    }

    .consultorio-input label {
      font-weight: bold;
    }

    .consultorio-input input {
      width: 60px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }


    /* =========================
       BOTÃO ALTA
    ========================= */

    .btn-alta {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-alta:hover {
      background: #b02a37;
    }


    /* =========================
       MODAL
    ========================= */

    .modal-alta {
      display: none;

      position: fixed;

      z-index: 9999;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      background: rgba(0,0,0,0.55);

      align-items: center;
      justify-content: center;
    }


    .modal-alta-conteudo {

      background: white;

      width: 95%;

      max-width: 700px;

      max-height: 90vh;

      overflow-y: auto;

      padding: 25px;

      border-radius: 10px;

      box-shadow: 0 5px 25px rgba(0,0,0,0.3);
    }


    .modal-alta-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 20px;

      border-bottom: 1px solid #ddd;

      padding-bottom: 12px;
    }


    .modal-alta-header h2 {

      margin: 0;

      color: #dc3545;
    }


    .fechar-modal {

      background: transparent;

      border: none;

      font-size: 28px;

      cursor: pointer;

      color: #666;
    }


    /* =========================
       CAMPOS
    ========================= */

    .campo-alta {

      margin-bottom: 16px;
    }


    .campo-alta label {

      display: block;

      margin-bottom: 6px;

      font-weight: bold;

      color: #333;
    }


    .campo-alta input,
    .campo-alta select,
    .campo-alta textarea {

      width: 100%;

      padding: 10px;

      border: 1px solid #ccc;

      border-radius: 5px;

      font-size: 14px;

      box-sizing: border-box;
    }


    .campo-alta textarea {

      min-height: 90px;

      resize: vertical;
    }


    /* =========================
       MEDICAÇÕES
    ========================= */

    .medicacoes-box {

      background: #f8f9fa;

      border: 1px solid #ddd;

      border-radius: 8px;

      padding: 15px;

      margin-top: 8px;
    }


    .medicacao-item {

      background: white;

      border: 1px solid #ddd;

      border-radius: 7px;

      padding: 15px;

      margin-bottom: 12px;
    }


    .medicacao-titulo {

      font-weight: bold;

      margin-bottom: 10px;

      color: #333;
    }


    .btn-adicionar-medicacao {

      background: #007bff;

      color: white;

      border: none;

      padding: 10px 15px;

      border-radius: 5px;

      cursor: pointer;

      margin-top: 5px;
    }


    .btn-adicionar-medicacao:hover {

      background: #0056b3;
    }


    .btn-remover-medicacao {

      background: #dc3545;

      color: white;

      border: none;

      padding: 6px 10px;

      border-radius: 5px;

      cursor: pointer;

      margin-top: 8px;
    }


    /* =========================
       BOTÕES
    ========================= */

    .botoes-alta {

      display: flex;

      justify-content: flex-end;

      gap: 10px;

      margin-top: 20px;
    }


    .btn-cancelar-alta {

      background: #6c757d;

      color: white;

      border: none;

      padding: 10px 18px;

      border-radius: 5px;

      cursor: pointer;
    }


    .btn-confirmar-alta {

      background: #dc3545;

      color: white;

      border: none;

      padding: 10px 18px;

      border-radius: 5px;

      cursor: pointer;

      font-weight: bold;
    }


    .btn-confirmar-alta:hover {

      background: #b02a37;
    }


    /* =========================
       PACIENTE
    ========================= */

    .info-paciente-alta {

      background: #f8f9fa;

      padding: 12px;

      border-radius: 6px;

      margin-bottom: 20px;

      border-left: 4px solid #dc3545;
    }

  </style>

</head>


<body>


<div class="container">


  <!-- =========================
       CABEÇALHO
  ========================= -->

  <div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  ">

    <h2 style="margin:0;">
      🩺 Painel Médico
    </h2>


    <button
      class="btn-abrir-tv"
      onclick="window.open('tv.html','_blank')"
    >
      📺 Abrir Tela da TV
    </button>

  </div>


  <!-- =========================
       CONSULTÓRIO
  ========================= -->

  <div class="consultorio-input">

    <label>
      Meu Consultório:
    </label>

    <input
      type="text"
      id="consultorio-num"
      value="01"
    >

    <span style="
      color:#666;
      font-size:13px;
    ">
      Este número será exibido na TV ao chamar o paciente.
    </span>

  </div>


  <!-- =========================
       PACIENTES
  ========================= -->

  <div id="triagens"></div>


  <hr>


  <!-- =========================
       CONSULTA
  ========================= -->

  <h3>
    Consulta
  </h3>


  <input
    id="paciente"
    placeholder="Paciente"
    readonly
  >


  <input
    id="diagnostico"
    placeholder="Diagnóstico"
  >


  <select id="medicacao">

    <option value="">
      Selecione a medicação
    </option>

    <!-- OPÇÕES DE MEDICAÇÃO -->

    <option value="Dipirona">
      Dipirona
    </option>

    <option value="Paracetamol">
      Paracetamol
    </option>

    <option value="Ibuprofeno">
      Ibuprofeno
    </option>

    <option value="Amoxicilina">
      Amoxicilina
    </option>

    <option value="Azitromicina">
      Azitromicina
    </option>

    <option value="Cefalexina">
      Cefalexina
    </option>

    <option value="Omeprazol">
      Omeprazol
    </option>

    <option value="Loratadina">
      Loratadina
    </option>

    <option value="Cetirizina">
      Cetirizina
    </option>

    <option value="Prednisona">
      Prednisona
    </option>

  </select>


  <textarea
    id="obs"
    placeholder="Observações"
  ></textarea>


  <button onclick="salvar()">
    Salvar
  </button>


</div>



<!-- ==================================================
     MODAL DE ALTA
================================================== -->

<div
  id="modalAlta"
  class="modal-alta"
>


  <div class="modal-alta-conteudo">


    <div class="modal-alta-header">

      <h2>
        🏥 Alta do Paciente
      </h2>


      <button
        class="fechar-modal"
        onclick="fecharAlta()"
      >
        ×
      </button>

    </div>


    <!-- PACIENTE -->

    <div class="info-paciente-alta">

      <strong>
        Paciente:
      </strong>

      <span id="altaPacienteNome">
        -
      </span>

    </div>


    <!-- FORMULÁRIO -->

    <form id="formularioAlta">


      <!-- PACIENTE -->

      <div class="campo-alta">

        <label>
          Paciente
        </label>

        <input
          type="text"
          id="altaPaciente"
          readonly
        >

      </div>


      <!-- DATA -->

      <div class="campo-alta">

        <label>
          Data da alta
        </label>

        <input
          type="date"
          id="altaData"
          required
        >

      </div>


      <!-- TIPO -->

      <div class="campo-alta">

        <label>
          Tipo de alta
        </label>


        <select
          id="altaTipo"
          required
        >

          <option value="">
            Selecione
          </option>

          <option value="ALTA_MEDICA">
            Alta médica
          </option>

          <option value="ALTA_A_PEDIDO">
            Alta a pedido
          </option>

          <option value="TRANSFERENCIA">
            Transferência
          </option>

          <option value="ALTA_ADMINISTRATIVA">
            Alta administrativa
          </option>

        </select>

      </div>


      <!-- DIAGNÓSTICO -->

      <div class="campo-alta">

        <label>
          Diagnóstico na alta
        </label>

        <textarea
          id="altaDiagnostico"
          placeholder="Informe o diagnóstico..."
          required
        ></textarea>

      </div>


      <!-- CONDIÇÃO -->

      <div class="campo-alta">

        <label>
          Condição do paciente
        </label>


        <select
          id="altaCondicao"
          required
        >

          <option value="">
            Selecione
          </option>

          <option value="ESTAVEL">
            Estável
          </option>

          <option value="MELHORADO">
            Melhorado
          </option>

          <option value="RECUPERADO">
            Recuperado
          </option>

        </select>

      </div>


      <!-- ==================================================
           MEDICAÇÕES DA ALTA
      ================================================== -->

      <div class="campo-alta">

        <label>
          💊 Medicações para o paciente
        </label>


        <div
          class="medicacoes-box"
          id="listaMedicacoesAlta"
        >

        </div>


        <button
          type="button"
          class="btn-adicionar-medicacao"
          onclick="adicionarMedicacaoAlta()"
        >
          ➕ Adicionar medicação
        </button>

      </div>


      <!-- ORIENTAÇÕES -->

      <div class="campo-alta">

        <label>
          Orientações ao paciente
        </label>


        <textarea
          id="altaOrientacoes"
          placeholder="Digite as orientações..."
        ></textarea>

      </div>


      <!-- OBSERVAÇÕES -->

      <div class="campo-alta">

        <label>
          Observações
        </label>


        <textarea
          id="altaObservacoes"
          placeholder="Observações adicionais..."
        ></textarea>

      </div>


      <!-- BOTÕES -->

      <div class="botoes-alta">

        <button
          type="button"
          class="btn-cancelar-alta"
          onclick="fecharAlta()"
        >
          Cancelar
        </button>


        <button
          type="submit"
          class="btn-confirmar-alta"
        >
          ✅ Confirmar alta
        </button>

      </div>


    </form>

  </div>

</div>



<script>


let triagensCarregadas = [];

let contadorMedicacoes = 0;



/* ==================================================
   LISTA DE MEDICAÇÕES
================================================== */

const listaDeMedicacoes = [

  "Dipirona",

  "Paracetamol",

  "Ibuprofeno",

  "Amoxicilina",

  "Azitromicina",

  "Cefalexina",

  "Omeprazol",

  "Loratadina",

  "Cetirizina",

  "Prednisona",

  "Diclofenaco",

  "Nimesulida",

  "Metformina",

  "Losartana",

  "Enalapril",

  "Atenolol",

  "Sinvastatina",

  "Atorvastatina",

  "AAS",

  "Clonazepam"

];



/* ==================================================
   CARREGAR PACIENTES
================================================== */

function carregar() {

  fetch("/triagens")

    .then(r => r.json())

    .then(data => {

      triagensCarregadas = data;

      const div =
        document.getElementById("triagens");

      div.innerHTML = "";


      if (data.length === 0) {

        div.innerHTML =
          "<p style='color:#888;text-align:center;'>Nenhum paciente na fila.</p>";

        return;

      }


      data.forEach((t, index) => {

        div.innerHTML += `

          <div class="card">

            <h3>
              ${t.nome}
            </h3>

            <p>
              <b>Sintoma:</b>
              ${t.sintoma || "Não informado"}
            </p>

            <p>
              <b>Temperatura:</b>
              ${t.temperatura || "Não informada"}°C
            </p>

            <p>
              <span class="${t.risco}">
                ${t.risco}
              </span>
            </p>

            <p>
              <b>Alergia:</b>
              ${t.alergia || "Nenhuma"}
            </p>

            <p>
              <b>Observação:</b>
              ${t.observacao || "Nenhuma"}
            </p>


            <div style="
              display:flex;
              gap:8px;
              flex-wrap:wrap;
            ">


              <button
                onclick="selecionar(${index})"
              >
                Atender
              </button>


              <button
                class="btn-tv"
                onclick="chamarNaTV('${t.nome}')"
              >
                📺 Chamar na TV
              </button>


              <button
                class="btn-alta"
                onclick="abrirAlta('${t.nome}')"
              >
                🏥 Dar alta
              </button>


            </div>

          </div>

        `;

      });

    })

    .catch(error => {

      console.error(
        "Erro ao carregar pacientes:",
        error
      );

    });

}



/* ==================================================
   CHAMAR NA TV
================================================== */

function chamarNaTV(nome) {

  const consultorio =
    document.getElementById(
      "consultorio-num"
    ).value || "01";


  fetch("/tv/chamar", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      localTipo: "CONSULTÓRIO",

      localNumero: consultorio,

      paciente: nome

    })

  })

  .then(r => r.json())

  .then(() => {

    alert(
      "✅ " +
      nome +
      " foi chamado na TV para o Consultório " +
      consultorio +
      "!"
    );

  });

}



/* ==================================================
   SELECIONAR PACIENTE
================================================== */

function selecionar(index) {

  const t =
    triagensCarregadas[index];


  document.getElementById(
    "paciente"
  ).value = t.nome;


  document.getElementById(
    "obs"
  ).value =
    t.observacao || "";


  if (
    t.alergia &&
    t.alergia !== "Nenhuma"
  ) {

    alert(
      "⚠️ Paciente possui alergia: " +
      t.alergia
    );

  }

}



/* ==================================================
   ABRIR ALTA
================================================== */

function abrirAlta(nome) {

  document.getElementById(
    "altaPaciente"
  ).value = nome;


  document.getElementById(
    "altaPacienteNome"
  ).textContent = nome;


  const hoje =
    new Date();


  const ano =
    hoje.getFullYear();


  const mes =
    String(
      hoje.getMonth() + 1
    ).padStart(2, "0");


  const dia =
    String(
      hoje.getDate()
    ).padStart(2, "0");


  document.getElementById(
    "altaData"
  ).value =
    `${ano}-${mes}-${dia}`;


  document.getElementById(
    "listaMedicacoesAlta"
  ).innerHTML = "";


  contadorMedicacoes = 0;


  adicionarMedicacaoAlta();


  document.getElementById(
    "modalAlta"
  ).style.display = "flex";

}



/* ==================================================
   FECHAR ALTA
================================================== */

function fecharAlta() {

  document.getElementById(
    "modalAlta"
  ).style.display = "none";

}



/* ==================================================
   ADICIONAR MEDICAÇÃO
================================================== */

function adicionarMedicacaoAlta() {

  contadorMedicacoes++;


  const id =
    contadorMedicacoes;


  const div =
    document.createElement("div");


  div.className =
    "medicacao-item";


  div.id =
    "medicacao-" + id;


  let opcoes = `

    <option value="">
      Selecione a medicação
    </option>

  `;


  listaDeMedicacoes.forEach(medicamento => {

    opcoes += `

      <option value="${medicamento}">
        ${medicamento}
      </option>

    `;

  });


  div.innerHTML = `

    <div class="medicacao-titulo">
      💊 Medicação ${id}
    </div>


    <div class="campo-alta">

      <label>
        Medicamento
      </label>


      <select
        class="medicacao-select"
        required
      >

        ${opcoes}

      </select>

    </div>


    <div class="campo-alta">

      <label>
        Posologia
      </label>


      <input
        type="text"
        class="posologia"
        placeholder="Ex.: 1 comprimido a cada 8 horas"
        required
      >

    </div>


    <div class="campo-alta">

      <label>
        Duração
      </label>


      <input
        type="text"
        class="duracao"
        placeholder="Ex.: 7 dias"
      >

    </div>


    <button
      type="button"
      class="btn-remover-medicacao"
      onclick="removerMedicacao(${id})"
    >
      🗑 Remover
    </button>

  `;


  document
    .getElementById(
      "listaMedicacoesAlta"
    )
    .appendChild(div);

}



/* ==================================================
   REMOVER MEDICAÇÃO
================================================== */

function removerMedicacao(id) {

  const item =
    document.getElementById(
      "medicacao-" + id
    );


  if (item) {

    item.remove();

  }

}



/* ==================================================
   CONFIRMAR ALTA
================================================== */

document
  .getElementById("formularioAlta")
  .addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      const medicamentos = [];


      document
        .querySelectorAll(".medicacao-item")
        .forEach(item => {

          const medicacao =
            item.querySelector(
              ".medicacao-select"
            ).value;


          const posologia =
            item.querySelector(
              ".posologia"
            ).value;


          const duracao =
            item.querySelector(
              ".duracao"
            ).value;


          if (medicacao) {

            medicamentos.push({

              medicacao:
                medicacao,

              posologia:
                posologia,

              duracao:
                duracao

            });

          }

        });


      if (
        medicamentos.length === 0
      ) {

        alert(
          "Selecione pelo menos uma medicação."
        );

        return;

      }


      const dadosAlta = {

        paciente:
          document.getElementById(
            "altaPaciente"
          ).value,

        dataAlta:
          document.getElementById(
            "altaData"
          ).value,

        tipoAlta:
          document.getElementById(
            "altaTipo"
          ).value,

        diagnostico:
          document.getElementById(
            "altaDiagnostico"
          ).value,

        condicao:
          document.getElementById(
            "altaCondicao"
          ).value,

        medicamentos:
          medicamentos,

        orientacoes:
          document.getElementById(
            "altaOrientacoes"
          ).value,

        observacoes:
          document.getElementById(
            "altaObservacoes"
          ).value

      };


      console.log(
        "Dados da alta:",
        dadosAlta
      );


      fetch("/alta", {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            dadosAlta
          )

      })

      .then(r => {

        if (!r.ok) {

          throw new Error(
            "Erro ao registrar alta"
          );

        }

        return r.json();

      })

      .then(() => {

        alert(
          "✅ Alta do paciente " +
          dadosAlta.paciente +
          " registrada com sucesso!"
        );


        fecharAlta();


        document
          .getElementById(
            "formularioAlta"
          )
          .reset();


        document
          .getElementById(
            "listaMedicacoesAlta"
          )
          .innerHTML = "";


        carregar();

      })

      .catch(error => {

        console.error(error);

        alert(
          "❌ Não foi possível registrar a alta."
        );

      });

    }
  );



/* ==================================================
   SALVAR CONSULTA
================================================== */

function salvar() {

  const paciente =
    document.getElementById(
      "paciente"
    ).value;


  const diagnostico =
    document.getElementById(
      "diagnostico"
    ).value;


  const medicacao =
    document.getElementById(
      "medicacao"
    ).value;


  const obs =
    document.getElementById(
      "obs"
    ).value;


  if (!paciente) {

    alert(
      "Selecione um paciente clicando em Atender."
    );

    return;

  }


  if (!medicacao) {

    alert(
      "Selecione uma medicação."
    );

    return;

  }


  fetch("/consulta", {

    method: "POST",

    headers: {
      "Content-Type":
        "application/json"
    },

    body: JSON.stringify({

      paciente,
      diagnostico,
      medicacao,
      obs

    })

  })

  .then(r => r.json())

  .then(() => {

    alert(
      "Consulta salva"
    );


    document.getElementById(
      "diagnostico"
    ).value = "";


    document.getElementById(
      "medicacao"
    ).value = "";


    document.getElementById(
      "obs"
    ).value = "";

  })

  .catch(error => {

    console.error(error);

    alert(
      "❌ Erro ao salvar consulta."
    );

  });

}



/* ==================================================
   FECHAR MODAL CLICANDO FORA
================================================== */

window.addEventListener(
  "click",
  function(event) {

    const modal =
      document.getElementById(
        "modalAlta"
      );


    if (event.target === modal) {

      fecharAlta();

    }

  }
);



/* ==================================================
   INICIAR
================================================== */

carregar();


/* Atualiza a fila */

setInterval(
  carregar,
  10000
);

</script>


</body>
</html>
