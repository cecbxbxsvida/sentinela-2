<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta do Paciente</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f9;
            padding: 40px;
        }

        .paciente-card {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .paciente-card h2 {
            color: #1f2937;
            margin-bottom: 10px;
        }

        .paciente-info {
            color: #6b7280;
            margin-bottom: 20px;
        }

        .btn-alta {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-alta:hover {
            background: #15803d;
        }

        /* Formulário */
        .formulario {
            display: none;
            max-width: 700px;
            margin: 25px auto 0;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .formulario h2 {
            color: #166534;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        .campo input,
        .campo select,
        .campo textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        .campo textarea {
            min-height: 100px;
            resize: vertical;
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn-cancelar {
            background: #6b7280;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-confirmar {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-cancelar:hover {
            background: #4b5563;
        }

        .btn-confirmar:hover {
            background: #15803d;
        }

        .mensagem {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #dcfce7;
            color: #166534;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Dados do paciente -->
    <div class="paciente-card">
        <h2>Paciente: João da Silva</h2>

        <div class="paciente-info">
            CPF: 123.456.789-00<br>
            Prontuário: 001245
        </div>

        <!-- BOTÃO DAR ALTA -->
        <button class="btn-alta" onclick="abrirFormulario()">
            🏥 Dar alta
        </button>
    </div>


    <!-- FORMULÁRIO DE ALTA -->
    <div class="formulario" id="formularioAlta">

        <h2>Formulário de Alta do Paciente</h2>

        <form id="formAlta">

            <div class="campo">
                <label for="paciente">Paciente</label>
                <input
                    type="text"
                    id="paciente"
                    value="João da Silva"
                    readonly
                >
            </div>

            <div class="campo">
                <label for="dataAlta">Data da alta</label>
                <input
                    type="date"
                    id="dataAlta"
                    required
                >
            </div>

            <div class="campo">
                <label for="tipoAlta">Tipo de alta</label>

                <select id="tipoAlta" required>
                    <option value="">Selecione</option>
                    <option value="medica">Alta médica</option>
                    <option value="administrativa">Alta administrativa</option>
                    <option value="pedido">Alta a pedido</option>
                    <option value="transferencia">Transferência</option>
                    <option value="obito">Óbito</option>
                </select>
            </div>

            <div class="campo">
                <label for="motivo">Motivo da alta</label>

                <textarea
                    id="motivo"
                    placeholder="Informe o motivo da alta..."
                    required
                ></textarea>
            </div>

            <div class="campo">
                <label for="orientacoes">Orientações ao paciente</label>

                <textarea
                    id="orientacoes"
                    placeholder="Informe as orientações para o paciente..."
                ></textarea>
            </div>

            <div class="campo">
                <label for="observacoes">Observações</label>

                <textarea
                    id="observacoes"
                    placeholder="Observações adicionais..."
                ></textarea>
            </div>

            <div class="botoes">

                <button
                    type="button"
                    class="btn-cancelar"
                    onclick="fecharFormulario()"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="btn-confirmar"
                >
                    Confirmar alta
                </button>

            </div>

        </form>

        <div class="mensagem" id="mensagem">
            ✅ Alta do paciente registrada com sucesso!
        </div>

    </div>


    <script>

        // Abre o formulário
        function abrirFormulario() {

            const formulario = document.getElementById("formularioAlta");

            formulario.style.display = "block";

            // Define a data atual automaticamente
            const hoje = new Date().toISOString().split("T")[0];

            document.getElementById("dataAlta").value = hoje;

            // Rola a tela até o formulário
            formulario.scrollIntoView({
                behavior: "smooth"
            });
        }


        // Fecha o formulário
        function fecharFormulario() {

            document.getElementById("formularioAlta").style.display = "none";

        }


        // Envia o formulário
        document.getElementById("formAlta").addEventListener("submit", function(event) {

            event.preventDefault();

            // Aqui você poderá enviar os dados para o banco de dados/API
            const paciente = document.getElementById("paciente").value;
            const dataAlta = document.getElementById("dataAlta").value;
            const tipoAlta = document.getElementById("tipoAlta").value;

            console.log("Paciente:", paciente);
            console.log("Data da alta:", dataAlta);
            console.log("Tipo de alta:", tipoAlta);

            // Exibe mensagem de sucesso
            document.getElementById("mensagem").style.display = "block";

        });

    </script>

</body>
</html>
