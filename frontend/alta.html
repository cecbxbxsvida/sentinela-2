<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Alta do Paciente</title>

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f1f3f5;

      color: #333;

    }


    .container-alta {

      width: 95%;

      max-width: 800px;

      margin: 0 auto;

      background: white;

      padding: 25px;

      border-radius: 10px;

      box-shadow:
        0 3px 15px
        rgba(0,0,0,0.12);

    }


    /* CABEÇALHO */

    .cabecalho-alta {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 20px;

      padding-bottom: 15px;

      border-bottom:
        1px solid #ddd;

    }


    .cabecalho-alta h2 {

      margin: 0;

      color: #dc3545;

    }


    .btn-voltar {

      background: #6c757d;

      color: white;

      border: none;

      padding: 9px 15px;

      border-radius: 5px;

      cursor: pointer;

      font-size: 14px;

    }


    .btn-voltar:hover {

      background: #545b62;

    }


    /* PACIENTE */

    .info-paciente {

      background: #f8f9fa;

      padding: 15px;

      border-radius: 7px;

      margin-bottom: 20px;

      border-left:
        5px solid #dc3545;

      font-size: 17px;

    }


    .info-paciente strong {

      color: #555;

    }


    #nomePaciente {

      font-weight: bold;

      color: #dc3545;

    }


    /* CAMPOS */

    .campo {

      margin-bottom: 18px;

    }


    .campo label {

      display: block;

      margin-bottom: 7px;

      font-weight: bold;

      color: #333;

    }


    .campo input,
    .campo select,
    .campo textarea {

      width: 100%;

      padding: 11px;

      border:
        1px solid #ccc;

      border-radius: 5px;

      font-size: 14px;

      font-family: inherit;

    }


    .campo input:focus,
    .campo select:focus,
    .campo textarea:focus {

      outline: none;

      border-color: #dc3545;

      box-shadow:
        0 0 0 2px
        rgba(220,53,69,0.1);

    }


    .campo textarea {

      min-height: 100px;

      resize: vertical;

    }


    /* MEDICAÇÕES */

    .medicacoes-box {

      background: #f8f9fa;

      border:
        1px solid #ddd;

      border-radius: 8px;

      padding: 15px;

    }


    .medicacao-item {

      background: white;

      border:
        1px solid #ddd;

      border-radius: 7px;

      padding: 15px;

      margin-bottom: 15px;

    }


    .medicacao-item:last-child {

      margin-bottom: 0;

    }


    .medicacao-titulo {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 15px;

      font-weight: bold;

      color: #007bff;

    }


    .btn-remover {

      background: #dc3545;

      color: white;

      border: none;

      padding: 6px 10px;

      border-radius: 5px;

      cursor: pointer;

      font-size: 13px;

    }


    .btn-remover:hover {

      background: #b02a37;

    }


    .btn-adicionar {

      margin-top: 12px;

      background: #007bff;

      color: white;

      border: none;

      padding: 10px 15px;

      border-radius: 5px;

      cursor: pointer;

      font-size: 14px;

    }


    .btn-adicionar:hover {

      background: #0056b3;

    }


    /* BOTÕES */

    .botoes {

      display: flex;

      justify-content: flex-end;

      gap: 10px;

      margin-top: 25px;

      padding-top: 20px;

      border-top:
        1px solid #ddd;

    }


    .btn-cancelar {

      background: #6c757d;

      color: white;

      border: none;

      padding: 11px 18px;

      border-radius: 5px;

      cursor: pointer;

    }


    .btn-confirmar {

      background: #dc3545;

      color: white;

      border: none;

      padding: 11px 20px;

      border-radius: 5px;

      cursor: pointer;

      font-weight: bold;

    }


    .btn-confirmar:hover {

      background: #b02a37;

    }


    /* MENSAGEM */

    .mensagem {

      display: none;

      padding: 12px;

      border-radius: 5px;

      margin-bottom: 15px;

      font-weight: bold;

    }


    .mensagem.sucesso {

      display: block;

      background: #d4edda;

      color: #155724;

      border:
        1px solid #c3e6cb;

    }


    .mensagem.erro {

      display: block;

      background: #f8d7da;

      color: #721c24;

      border:
        1px solid #f5c6cb;

    }


    @media (max-width: 600px) {

      body {
        padding: 10px;
      }

      .container-alta {
        width: 100%;
        padding: 18px;
      }

      .cabecalho-alta {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .botoes {
        flex-direction: column;
      }

      .botoes button {
        width: 100%;
      }

    }

  </style>

</head>


<body>


<div class="container-alta">


  <!-- CABEÇALHO -->

  <div class="cabecalho-alta">

    <h2>
      🏥 Alta do Paciente
    </h2>

    <button
      type="button"
      class="btn-voltar"
      onclick="voltarPainel()"
    >
      ← Voltar ao painel
    </button>

  </div>


  <!-- MENSAGEM -->

  <div
    id="mensagem"
    class="mensagem"
  ></div>


  <!-- PACIENTE -->

  <div class="info-paciente">

    <strong>
      Paciente:
    </strong>

    <span id="nomePaciente">
      -
    </span>

  </div>


  <!-- FORMULÁRIO -->

  <form id="formularioAlta">


    <!-- PACIENTE -->

    <div class="campo">

      <label>
        Paciente
      </label>

      <input
        type="text"
        id="altaPaciente"
        readonly
      >

    </div>


    <!-- DATA -->

    <div class="campo">

      <label>
        Data da alta
      </label>

      <input
        type="date"
        id="altaData"
        required
      >

    </div>


    <!-- TIPO -->

    <div class="campo">

      <label>
        Tipo de alta
      </label>

      <select
        id="altaTipo"
        required
      >

        <option value="">
          Selecione
        </option>

        <option value="ALTA_MEDICA">
          Alta médica
        </option>

        <option value="ALTA_A_PEDIDO">
          Alta a pedido
        </option>

        <option value="TRANSFERENCIA">
          Transferência
        </option>

        <option value="ALTA_ADMINISTRATIVA">
          Alta administrativa
        </option>

      </select>

    </div>


    <!-- DIAGNÓSTICO -->

    <div class="campo">

      <label>
        Diagnóstico na alta
      </label>

      <textarea
        id="altaDiagnostico"
        placeholder="Informe o diagnóstico..."
        required
      ></textarea>

    </div>


    <!-- CONDIÇÃO -->

    <div class="campo">

      <label>
        Condição do paciente
      </label>

      <select
        id="altaCondicao"
        required
      >

        <option value="">
          Selecione
        </option>

        <option value="ESTAVEL">
          Estável
        </option>

        <option value="MELHORADO">
          Melhorado
        </option>

        <option value="RECUPERADO">
          Recuperado
        </option>

      </select>

    </div>


    <!-- MEDICAÇÕES -->

    <div class="campo">

      <label>
        💊 Medicações para o paciente
      </label>


      <div
        class="medicacoes-box"
        id="listaMedicacoes"
      >
      </div>


      <button
        type="button"
        class="btn-adicionar"
        onclick="adicionarMedicacao()"
      >
        ➕ Adicionar medicação
      </button>

    </div>


    <!-- ORIENTAÇÕES -->

    <div class="campo">

      <label>
        Orientações ao paciente
      </label>

      <textarea
        id="altaOrientacoes"
        placeholder="Digite as orientações..."
      ></textarea>

    </div>


    <!-- OBSERVAÇÕES -->

    <div class="campo">

      <label>
        Observações
      </label>

      <textarea
        id="altaObservacoes"
        placeholder="Observações adicionais..."
      ></textarea>

    </div>


    <!-- BOTÕES -->

    <div class="botoes">

      <button
        type="button"
        class="btn-cancelar"
        onclick="voltarPainel()"
      >
        Cancelar
      </button>


      <button
        type="submit"
        class="btn-confirmar"
      >
        ✅ Confirmar alta
      </button>

    </div>


  </form>

</div>


<script>


/* ==================================================
   VARIÁVEIS
================================================== */

let contadorMedicacoes = 0;


/* ==================================================
   LISTA DE MEDICAÇÕES
================================================== */

const listaDeMedicacoes = [

  "Dipirona",
  "Paracetamol",
  "Ibuprofeno",
  "Amoxicilina",
  "Azitromicina",
  "Cefalexina",
  "Omeprazol",
  "Loratadina",
  "Cetirizina",
  "Prednisona",
  "Diclofenaco",
  "Nimesulida",
  "Metformina",
  "Losartana",
  "Enalapril",
  "Atenolol",
  "Sinvastatina",
  "Atorvastatina",
  "AAS",
  "Clonazepam"

];


/* ==================================================
   PEGAR PACIENTE DA URL
================================================== */

function carregarPaciente() {

  const parametros =
    new URLSearchParams(
      window.location.search
    );


  const paciente =
    parametros.get("paciente");


  if (!paciente) {

    document.getElementById(
      "nomePaciente"
    ).textContent =
      "Paciente não informado";

    return;

  }


  document.getElementById(
    "nomePaciente"
  ).textContent =
    paciente;


  document.getElementById(
    "altaPaciente"
  ).value =
    paciente;

}


/* ==================================================
   DATA ATUAL
================================================== */

function colocarDataAtual() {

  const hoje =
    new Date();


  const ano =
    hoje.getFullYear();


  const mes =
    String(
      hoje.getMonth() + 1
    ).padStart(2, "0");


  const dia =
    String(
      hoje.getDate()
    ).padStart(2, "0");


  document.getElementById(
    "altaData"
  ).value =
    `${ano}-${mes}-${dia}`;

}


/* ==================================================
   ADICIONAR MEDICAÇÃO
================================================== */

function adicionarMedicacao() {

  contadorMedicacoes++;


  const id =
    contadorMedicacoes;


  const div =
    document.createElement("div");


  div.className =
    "medicacao-item";


  div.id =
    "medicacao-" + id;


  let opcoes = `

    <option value="">
      Selecione a medicação
    </option>

  `;


  listaDeMedicacoes.forEach(
    medicamento => {

      opcoes += `

        <option value="${medicamento}">
          ${medicamento}
        </option>

      `;

    }
  );


  div.innerHTML = `

    <div class="medicacao-titulo">

      <span>
        💊 Medicação ${id}
      </span>

      <button
        type="button"
        class="btn-remover"
        onclick="removerMedicacao(${id})"
      >
        🗑 Remover
      </button>

    </div>


    <div class="campo">

      <label>
        Medicamento
      </label>

      <select
        class="medicacao-select"
        required
      >

        ${opcoes}

      </select>

    </div>


    <div class="campo">

      <label>
        Posologia
      </label>

      <input
        type="text"
        class="posologia"
        placeholder="Ex.: 1 comprimido a cada 8 horas"
        required
      >

    </div>


    <div class="campo">

      <label>
        Duração
      </label>

      <input
        type="text"
        class="duracao"
        placeholder="Ex.: 7 dias"
      >

    </div>

  `;


  document
    .getElementById(
      "listaMedicacoes"
    )
    .appendChild(div);

}


/* ==================================================
   REMOVER MEDICAÇÃO
================================================== */

function removerMedicacao(id) {

  const item =
    document.getElementById(
      "medicacao-" + id
    );


  if (item) {

    item.remove();

  }

}


/* ==================================================
   MENSAGEM
================================================== */

function mostrarMensagem(
  texto,
  tipo
) {

  const mensagem =
    document.getElementById(
      "mensagem"
    );


  mensagem.textContent =
    texto;


  mensagem.className =
    "mensagem " + tipo;

}


/* ==================================================
   CONFIRMAR ALTA
================================================== */

document
  .getElementById(
    "formularioAlta"
  )
  .addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      const paciente =
        document.getElementById(
          "altaPaciente"
        ).value;


      if (!paciente) {

        mostrarMensagem(
          "❌ Paciente não informado.",
          "erro"
        );

        return;

      }


      const medicamentos = [];


      document
        .querySelectorAll(
          ".medicacao-item"
        )
        .forEach(item => {

          const medicacao =
            item.querySelector(
              ".medicacao-select"
            ).value;


          const posologia =
            item.querySelector(
              ".posologia"
            ).value;


          const duracao =
            item.querySelector(
              ".duracao"
            ).value;


          if (medicacao) {

            medicamentos.push({

              medicacao:
                medicacao,

              posologia:
                posologia,

              duracao:
                duracao

            });

          }

        });


      /*
       * Se quiser obrigar pelo menos
       * uma medicação, mantenha este bloco.
       */

      if (
        medicamentos.length === 0
      ) {

        mostrarMensagem(
          "❌ Adicione pelo menos uma medicação.",
          "erro"
        );

        return;

      }


      const dadosAlta = {

        paciente:
          paciente,

        dataAlta:
          document.getElementById(
            "altaData"
          ).value,

        tipoAlta:
          document.getElementById(
            "altaTipo"
          ).value,

        diagnostico:
          document.getElementById(
            "altaDiagnostico"
          ).value,

        condicao:
          document.getElementById(
            "altaCondicao"
          ).value,

        medicamentos:
          medicamentos,

        orientacoes:
          document.getElementById(
            "altaOrientacoes"
          ).value,

        observacoes:
          document.getElementById(
            "altaObservacoes"
          ).value

      };


      console.log(
        "Dados da alta:",
        dadosAlta
      );


      fetch("/alta", {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify(
            dadosAlta
          )

      })

      .then(response => {

        if (!response.ok) {

          throw new Error(
            "Erro ao registrar alta"
          );

        }

        return response.json();

      })

      .then(() => {

        mostrarMensagem(
          "✅ Alta do paciente " +
          paciente +
          " registrada com sucesso!",
          "sucesso"
        );


        /*
         * Aguarda um pouco e retorna
         * para o painel médico.
         */

        setTimeout(
          () => {

            window.location.href =
              "index.html";

          },
          1500
        );

      })

      .catch(error => {

        console.error(error);

        mostrarMensagem(
          "❌ Não foi possível registrar a alta.",
          "erro"
        );

      });

    }
  );


/* ==================================================
   VOLTAR AO PAINEL
================================================== */

function voltarPainel() {

  window.location.href =
    "index.html";

}


/* ==================================================
   INICIAR
================================================== */

carregarPaciente();

colocarDataAtual();

adicionarMedicacao();

</script>


</body>

</html>
